plugins {
    id 'java'
    id 'application'
}

group = 'com.codealpha.devops'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 for unit testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
}

application {
    mainClass = 'com.codealpha.devops.Main'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showExceptions true
        showCauses true
        showStackTraces true
    }
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.codealpha.devops.Main',
            'Implementation-Title': 'DevOps Task Tracker',
            'Implementation-Version': version,
            'Built-By': 'Mysura Reddy'
        )
    }
}

// Custom Gradle task: Display Application Info
tasks.register('appInfo') {
    doLast {
        println "=============================================="
        println " Application : ${project.name}"
        println " Version     : ${project.version}"
        println " Group       : ${project.group}"
        println " Main Class  : ${application.mainClass.get()}"
        println " Author      : Mysura Reddy"
        println " Internship  : CodeAlpha DevOps Internship"
        println "=============================================="
    }
}
