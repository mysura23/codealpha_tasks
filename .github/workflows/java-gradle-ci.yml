name: Java Gradle CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test Java Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task3-java-gradle

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --info

      - name: Run JUnit Tests
        run: ./gradlew test

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: task3-java-gradle/build/reports/tests/test/

      - name: Upload Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: task3-java-gradle/build/libs/*.jar
